<!doctype html>
<html lang="de" data-season="autumn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurassic Wood App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html[data-season=autumn]{--bg:#1F2A22;--card:#2B3A2F;--line:#44574A;--tx:#F3EBDD;--sub:#B9C4B5;--ac:#E0A458;--ink:#1F2A22}
html[data-season=winter]{--bg:#E4ECF5;--card:#F7FAFD;--line:#C9D6E4;--tx:#1F2D44;--sub:#52627A;--ac:#2E5A88;--ink:#FFFFFF;--tile:#E6EEF6}
html[data-season=winter] body{background:linear-gradient(180deg,#C9D8E8 0%,#E4ECF5 55%,#EEF3F8 100%) fixed}
html[data-season=spring]{--bg:#F3F7EC;--card:#FFFFFF;--line:#D5E3C4;--tx:#26331F;--sub:#55664A;--ac:#3F7A30;--ink:#FFFFFF}
html[data-season=summer]{--bg:#FFF8E6;--card:#FFFFFF;--line:#F0DFAE;--tx:#33290F;--sub:#6B5B2A;--ac:#A85A0C;--ink:#FFFFFF}
html,body{margin:0;background:var(--bg);color:var(--tx);transition:background .4s}
body{font-family:'Nunito',system-ui,sans-serif;font-size:16px;min-height:100vh}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:24px 20px 110px;position:relative;z-index:1}
h1{font:600 30px 'Fraunces',Georgia,serif;margin:0;color:var(--ac)}
h2{font:600 20px 'Fraunces',Georgia,serif;margin:0 0 10px}
.sub{color:var(--sub);font-size:14px;margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:16px 0}
.row{display:flex;align-items:center;gap:14px}
.row .btn{margin-left:auto}
.av{display:grid;place-items:center;flex:none;border-radius:50%;color:#1F2A22;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-decoration:none}
.tile svg{color:var(--ac)}
.tile b{display:block;font:600 19px 'Fraunces',Georgia,serif}
.tile small{display:block;font-size:13px;color:var(--sub)}
.tile.off{grid-column:span 2;min-height:84px;flex-direction:row;align-items:center;gap:14px;opacity:.75}
.pick{display:grid;gap:12px;margin:20px 0}
.pick button{display:flex;align-items:center;gap:14px;text-align:left;min-height:72px;padding:12px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:18px;cursor:pointer}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--ac);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--ac);text-decoration:none;font-weight:700}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px}
select,input[type=number]{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:16px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
ul{margin:0;padding-left:20px;line-height:1.7}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2}
.nav a{flex:1;min-height:56px;display:grid;place-items:center;font-size:13px;color:var(--sub);text-decoration:none}
.nav a[aria-current]{color:var(--ac);font-weight:700}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs a{flex:1;min-height:44px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);color:var(--tx);text-decoration:none}
.tabs a[aria-current]{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:700}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
input[type=text],input[type=search],input[type=email],input[type=password],textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
input[type=file]{width:100%;color:var(--sub)}
.chk{margin:0}
.chk input:checked+span{text-decoration:line-through;color:var(--sub)}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rc{position:relative;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);overflow:hidden}
.rc .rl{display:block;color:inherit;text-decoration:none}
.sel{position:absolute;top:8px;right:8px;width:44px;height:44px;margin:0;display:grid;place-items:center;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.sel input{width:24px;height:24px;margin:0;accent-color:var(--ac)}
.bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--card);border-top:1px solid var(--line);z-index:2}
.bar[hidden]{display:none}
.sn small{display:block}
.rc img,.rc .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.rc .ph{display:grid;place-items:center;background:var(--line);color:var(--sub)}
.rc .t{padding:10px 12px}.rc b{display:block}.rc small{color:var(--sub)}
.pv{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin:12px 0}
.ir{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ir .iu{grid-column:span 2}.ir .in{grid-column:1/4}.ir .ic{grid-column:1/3}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--tx);font-size:20px}
.cat{font:600 17px 'Fraunces',Georgia,serif;color:var(--ac);margin:22px 0 4px}
.si{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--line)}
.si input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac);flex:none}
.si .sn{flex:1}.si.dn .sn{text-decoration:line-through;color:var(--sub)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:20px}
.qty input{width:54px;min-height:44px;padding:0 4px;text-align:center}
.qty small{width:26px}
input[type=date],input[type=url]{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.tabs.s{flex-wrap:wrap}.tabs.s a{flex:1 1 30%;font-size:14px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden}
.hc.done,.hc.cancelled{opacity:.7}
.hd{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;background:transparent;border:0;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.hb{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;font-weight:700;color:var(--ink)}
.hc.done .hb{background:var(--ac)}.hc.absent .hb{border-color:#D98C5F}.hc.cancelled .hb{border-color:#C0504D}
.ht b{display:block}.ht small{color:var(--sub)}.hc.done .ht b{text-decoration:line-through}
.hs{display:flex;gap:8px;padding:0 14px 12px}
.hs button{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:13px}
.hs button[aria-pressed=true]{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.nv{display:flex;align-items:center;gap:8px;margin:12px 0}.nv b{flex:1;text-align:center}
.nv button{min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.hh{display:flex;align-items:center;gap:10px;margin:20px 0 4px}.hh h2{margin:0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--sub);margin:2px 4px 2px 0}
.warn{border:1px solid #D98C5F;background:var(--card);border-radius:16px;padding:12px 14px;margin:12px 0}
.big{font:600 38px 'Fraunces',Georgia,serif;color:var(--ac)}
.wheel{display:block;margin:12px auto;width:min(100%,320px)}
.wheel .rot{transform-origin:150px 150px}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.gls{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.gl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-decoration:none}
.gl .gt{flex:1;min-width:0;display:block}.gl .gt b{display:block}.gl .gt small{display:block;color:var(--sub)}
.gl0{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:inherit;text-decoration:none}
.ph2{display:grid;place-items:center;color:var(--sub)}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:12px;text-decoration:none;padding:0}
.sr{display:flex;gap:8px;align-items:center}.sr input{flex:1;min-width:0}
.pt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.ptb{min-width:44px;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:600;font-size:18px;font-family:inherit;cursor:pointer}
.ptb.on,button.chip.on{background:var(--ac);color:var(--ink);border-color:var(--ac)}
button.chip{cursor:pointer;background:var(--card);font-family:inherit;min-height:32px}

.gh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:8px 0 14px}
.gh h1{margin:0;text-align:center;font-size:22px;line-height:1.2}
.gb{display:grid;place-items:center;width:44px;height:44px;color:var(--tx)}
.gp{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--ac);color:var(--ink);font-size:28px;font-weight:600;text-decoration:none;line-height:1}
.sw{position:relative;margin:4px 0 10px}.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}.sw input{padding-left:46px;margin:0}
.gfb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.tgr{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.tgc{flex:none;min-height:42px;padding:0 22px;border:1px solid var(--line);border-radius:4px;background:#F3EBDD;color:#1F2A22;font:inherit;cursor:pointer}
.tgc.on{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.gl{border-radius:10px;padding:10px 12px}
.cv{width:92px;height:92px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.cv.big{width:130px;height:130px}
.gm{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;color:var(--tx);font-size:14px}
.gm1{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px}.gm1 svg{flex:none}
.bd{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;flex:none}.bd.sp{background:#1DB954}.bd.yt{background:#E03B3B}
.gcol{display:flex;flex-direction:column;gap:8px;align-items:center}
.chv{color:var(--sub);flex:none;display:grid;place-items:center}
.ib{width:auto;min-width:44px;padding:0 6px}
.hr{display:flex;align-items:center;gap:16px;padding:18px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;margin-bottom:14px}
.hr b{display:block;font-size:19px}.hr small{color:var(--sub)}
.hi{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.rr{display:flex;gap:16px;align-items:center;margin:12px 0}.ri{display:flex;flex-direction:column;gap:14px;flex:1}.ri div{display:flex;align-items:center;gap:14px}.ri svg{color:var(--sub);flex:none}
.ptb{background:#F3EBDD;color:#1F2A22;border-radius:6px;flex:1;min-width:40px}
.ptb.on{background:var(--ac)}
.tl{color:var(--ac)}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.p{position:absolute;top:-30px;animation:fall linear infinite}
.p.autumn{border-radius:0 100% 0 100%}
.p.winter{border-radius:50%;opacity:.8}
.p.spring{border-radius:50% 0 50% 0;opacity:.9}
.p.summer{border-radius:50%;opacity:.7;top:auto;bottom:-20px;animation-name:rise}
h1.app{color:var(--tx);font-size:28px;line-height:1.1}
.me{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:700;text-decoration:none;flex:none}
.av.im{background:#E3EFD6;overflow:hidden}.av.im img{width:112%;height:auto;margin-top:6%;display:block}
.mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.mt{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;min-height:132px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--tile,var(--card));color:var(--tx);text-decoration:none}
.mt b{display:block;font:600 19px/1.15 'Fraunces',Georgia,serif}.mt small{font-size:12px;color:var(--sub)}
.mt svg{position:absolute;right:10px;bottom:10px;color:var(--ac);opacity:.6}
.scene{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));height:10vh;z-index:0;pointer-events:none}
.scene svg{display:block;width:100%;height:100%}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@keyframes rise{to{transform:translate3d(var(--dx),-110vh,0)}}
</style>
</head>

<script type="module">
/*SYNC-START*/
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(q=>[q,x[q]])):x);
const sig=it=>canon(Object.assign({},it,{img:typeof it.img==='string'?it.img.length+':'+it.img.slice(-24):it.img}));
function startSync(FS,db,H,onState){
 const NAMES=Object.keys(H.cols),ready={},last={shared:undefined},unsubs=[];
 let all=false,stopped=false;
 NAMES.forEach(n=>{last[n]={}});
 const code=e=>e&&e.code?' ('+e.code+')':'';
 const lg=t=>{if(H.log)H.log(t)};
 const failL=e=>{if(stopped)return;lg('Fehler: '+(e&&e.code||e));H.err=e&&e.code==='permission-denied'?'Keine Berechtigung auf die Datenbank. Prüfe die Firestore-Regeln und ob dein Konto freigegeben ist.':'Verbindung zu Firebase fehlgeschlagen'+code(e)+'.';onState('error')};
 const failW=e=>{H.warn=e&&e.code==='permission-denied'?'Änderungen konnten nicht gespeichert werden: keine Berechtigung (Firestore-Regeln).':'Änderungen konnten nicht synchronisiert werden'+code(e)+'.';if(all)H.soft()};
 const changed=()=>{if(!all)return;H.persistS();H.soft()};
 function applyShared(d){const c=canon(d);last.shared=c;if(c!==canon(H.getShared())){H.setShared(d);changed()}}
 function applyCol(n,remote){
  const get=H.cols[n][0],set=H.cols[n][1],loc=get(),
   m=new Map(loc.filter(x=>x&&x.id).map(x=>[x.id,sig(x)])),rs=new Map(remote.map(x=>[x.id,sig(x)]));
  last[n]=Object.fromEntries(rs);
  let same=m.size===rs.size;
  if(same)for(const [id,s] of rs){if(m.get(id)!==s){same=false;break}}
  if(!same){remote.sort((a,b)=>a.id<b.id?1:-1);set(remote);changed()}}
 function doPush(){
  if(!all||stopped)return;
  try{
   const sh=H.getShared(),cs=canon(sh);
   if(cs!==last.shared){last.shared=cs;FS.setDoc(FS.doc(db,'shared','main'),sh).catch(failW)}
   for(const n of NAMES){
    const items=H.cols[n][0](),seen=new Set(),L=last[n];
    for(const it of items){if(!it||!it.id)continue;seen.add(it.id);const s=sig(it);if(L[it.id]!==s){L[it.id]=s;FS.setDoc(FS.doc(db,n,it.id),JSON.parse(JSON.stringify(it))).catch(failW)}}
    for(const id of Object.keys(L)){if(!seen.has(id)){delete L[id];FS.deleteDoc(FS.doc(db,n,id)).catch(failW)}}}
  }catch(e){failW(e)}}
 const check=()=>{if(all||stopped)return;if(!ready.shared||!NAMES.every(n=>ready[n]))return;all=true;H.persistS();H.clearCols();onState('in');doPush()};
 unsubs.push(FS.onSnapshot(FS.doc(db,'shared','main'),snap=>{
  if(stopped)return;
  lg('shared: '+(snap.exists()?'vorhanden':'leer')+(snap.metadata.fromCache?' (Cache)':' (Server)'));
  if(!ready.shared){
   if(snap.exists()||!snap.metadata.fromCache){ready.shared=true;if(snap.exists())applyShared(snap.data());check()}
   return}
  if(snap.exists())applyShared(snap.data())},failL));
 NAMES.forEach(n=>unsubs.push(FS.onSnapshot(FS.collection(db,n),snap=>{
  if(stopped)return;
  const remote=[];snap.forEach(d=>{const x=d.data();if(x&&x.id)remote.push(x)});
  lg(n+': '+remote.length+(snap.metadata.fromCache?' (Cache)':' (Server)'));
  if(!ready[n]){
   if(!snap.empty||!snap.metadata.fromCache){
    ready[n]=true;
    if(snap.empty&&H.cols[n][0]().length){last[n]={}}else{applyCol(n,remote)}
    check()}
   return}
  applyCol(n,remote)},failL)));
 H.push=doPush;
 return{push:doPush,stop(){stopped=true;unsubs.forEach(u=>{try{u()}catch(e){}});H.push=()=>{}}}}
/*SYNC-END*/

  sync=startSync(FS,db,FBH,s=>{clearTimeout(t2);FBH.st=s==='in'?'in':'sync';render()})
 },e=>{FBH.err='Anmeldestatus konnte nicht geprüft werden'+(e&&e.code?' ('+e.code+')':'')+'.';FBH.st='login';render()});
