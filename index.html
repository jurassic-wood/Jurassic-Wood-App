<!doctype html>
<html lang="de" data-season="autumn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurassic Wood App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html[data-season=autumn]{--bg:#1F2A22;--card:#2B3A2F;--line:#44574A;--tx:#F3EBDD;--sub:#B9C4B5;--ac:#E0A458;--ink:#1F2A22}
html[data-season=winter]{--bg:#E4ECF5;--card:#F7FAFD;--line:#C9D6E4;--tx:#1F2D44;--sub:#52627A;--ac:#2E5A88;--ink:#FFFFFF;--tile:#E6EEF6}
html[data-season=winter] body{background:linear-gradient(180deg,#C9D8E8 0%,#E4ECF5 55%,#EEF3F8 100%) fixed}
html[data-season=xmas]{--bg:#E4ECF5;--card:#F7FAFD;--line:#D8CFC6;--tx:#2A2320;--sub:#5E554E;--ac:#B3262E;--ink:#FFFFFF;--tile:#F3ECE6}
html[data-season=xmas] body{background:linear-gradient(180deg,#C9D8E8 0%,#E4ECF5 55%,#EEF3F8 100%) fixed}
html[data-season=halloween]{--bg:#1D1626;--card:#2A2135;--line:#4A3A5C;--tx:#F4ECDD;--sub:#C5B8D4;--ac:#F08A24;--ink:#1D1626}
html[data-season=off]{--bg:#F5F5F3;--card:#FFFFFF;--line:#E0E0DC;--tx:#1F2328;--sub:#5B616B;--ac:#2E5A88;--ink:#FFFFFF}
html[data-season=spring]{--bg:#F3F7EC;--card:#FFFFFF;--line:#D5E3C4;--tx:#26331F;--sub:#55664A;--ac:#3F7A30;--ink:#FFFFFF}
html[data-season=summer]{--bg:#FFF8E6;--card:#FFFFFF;--line:#F0DFAE;--tx:#33290F;--sub:#6B5B2A;--ac:#A85A0C;--ink:#FFFFFF}
html,body{margin:0;background:var(--bg);color:var(--tx);transition:background .4s}
body{font-family:'Nunito',system-ui,sans-serif;font-size:16px;min-height:100vh}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:24px 20px 110px;position:relative;z-index:1}
h1{font:600 30px 'Fraunces',Georgia,serif;margin:0;color:var(--ac)}
h2{font:600 20px 'Fraunces',Georgia,serif;margin:0 0 10px}
.sub{color:var(--sub);font-size:14px;margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:16px 0}
.row{display:flex;align-items:center;gap:14px}
.row .btn{margin-left:auto}
.av{display:grid;place-items:center;flex:none;border-radius:50%;color:#1F2A22;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-decoration:none}
.tile svg{color:var(--ac)}
.tile b{display:block;font:600 19px 'Fraunces',Georgia,serif}
.tile small{display:block;font-size:13px;color:var(--sub)}
.tile.off{grid-column:span 2;min-height:84px;flex-direction:row;align-items:center;gap:14px;opacity:.75}
.pick{display:grid;gap:12px;margin:20px 0}
.pick button{display:flex;align-items:center;gap:14px;text-align:left;min-height:72px;padding:12px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:18px;cursor:pointer}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--ac);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--ac);text-decoration:none;font-weight:700}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 6px}
select,input[type=number]{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:16px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
ul{margin:0;padding-left:20px;line-height:1.7}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2}
.nav a{flex:1;min-height:56px;display:grid;place-items:center;font-size:13px;color:var(--sub);text-decoration:none}
.nav a[aria-current]{color:var(--ac);font-weight:700}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs a{flex:1;min-height:44px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);color:var(--tx);text-decoration:none}
.tabs a[aria-current]{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:700}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
input[type=text],input[type=search],input[type=email],input[type=password],textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
input[type=file]{width:100%;color:var(--sub)}
.chk{margin:0}
.chk input:checked+span{text-decoration:line-through;color:var(--sub)}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rc{position:relative;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--tx);overflow:hidden}
.rc .rl{display:block;color:inherit;text-decoration:none}
.sel{position:absolute;top:8px;right:8px;width:44px;height:44px;margin:0;display:grid;place-items:center;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.sel input{width:24px;height:24px;margin:0;accent-color:var(--ac)}
.bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--card);border-top:1px solid var(--line);z-index:2}
.bar[hidden]{display:none}
.sn small{display:block}
.rc img,.rc .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.rc .ph{display:grid;place-items:center;background:var(--line);color:var(--sub)}
.rc .t{padding:10px 12px}.rc b{display:block}.rc small{color:var(--sub)}
.pv{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin:12px 0}
.ir{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ir .iu{grid-column:span 2}.ir .in{grid-column:1/4}.ir .ic{grid-column:1/3}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--tx);font-size:20px}
.cat{font:600 17px 'Fraunces',Georgia,serif;color:var(--ac);margin:22px 0 4px}
.si{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--line)}
.si input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac);flex:none}
.si .sn{flex:1}.si.dn .sn{text-decoration:line-through;color:var(--sub)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:20px}
.qty input{width:54px;min-height:44px;padding:0 4px;text-align:center}
.qty small{width:26px}
input[type=date],input[type=url]{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.tabs.s{flex-wrap:wrap}.tabs.s a{flex:1 1 30%;font-size:14px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden}
.hc.done,.hc.cancelled{opacity:.7}
.hd{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;background:transparent;border:0;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.hb{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;font-weight:700;color:var(--ink)}
.hc.done .hb{background:var(--ac)}.hc.absent .hb{border-color:#D98C5F}.hc.cancelled .hb{border-color:#C0504D}
.ht b{display:block}.ht small{color:var(--sub)}.hc.done .ht b{text-decoration:line-through}
.hs{display:flex;gap:8px;padding:0 14px 12px}
.hs button{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:13px}
.hs button[aria-pressed=true]{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.nv{display:flex;align-items:center;gap:8px;margin:12px 0}.nv b{flex:1;text-align:center}
.nv button{min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.hh{display:flex;align-items:center;gap:10px;margin:20px 0 4px}.hh h2{margin:0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--sub);margin:2px 4px 2px 0}
.warn{border:1px solid #D98C5F;background:var(--card);border-radius:16px;padding:12px 14px;margin:12px 0}
.big{font:600 38px 'Fraunces',Georgia,serif;color:var(--ac)}
.wheel{display:block;margin:12px auto;width:min(100%,320px)}
.wheel .rot{transform-origin:150px 150px}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.gls{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.gl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-decoration:none}
.gl .gt{flex:1;min-width:0;display:block}.gl .gt b{display:block}.gl .gt small{display:block;color:var(--sub)}
.gl0{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:inherit;text-decoration:none}
.ph2{display:grid;place-items:center;color:var(--sub)}
.ib{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:12px;text-decoration:none;padding:0}
.sr{display:flex;gap:8px;align-items:center}.sr input{flex:1;min-width:0}
.pt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.ptb{min-width:44px;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:600;font-size:18px;font-family:inherit;cursor:pointer}
.ptb.on,button.chip.on{background:var(--ac);color:var(--ink);border-color:var(--ac)}
button.chip{cursor:pointer;background:var(--card);font-family:inherit;min-height:32px}

.gh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:8px 0 14px}
.gh h1{margin:0;text-align:center;font-size:22px;line-height:1.2}
.gb{display:grid;place-items:center;width:44px;height:44px;color:var(--tx)}
.gp{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--ac);color:var(--ink);font-size:28px;font-weight:600;text-decoration:none;line-height:1}
.sw{position:relative;margin:4px 0 10px}.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}.sw input{padding-left:46px;margin:0}
.gfb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.tgr{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.tgc{flex:none;min-height:42px;padding:0 22px;border:1px solid var(--line);border-radius:4px;background:#F3EBDD;color:#1F2A22;font:inherit;cursor:pointer}
.tgc.on{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.gl{border-radius:10px;padding:10px 12px}
.cv{width:92px;height:92px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.cv.big{width:130px;height:130px}
.gm{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;color:var(--tx);font-size:14px}
.gm1{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px}.gm1 svg{flex:none}
.bd{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;flex:none}.bd.sp{background:#1DB954}.bd.yt{background:#E03B3B}
.gcol{display:flex;flex-direction:column;gap:8px;align-items:center}
.chv{color:var(--sub);flex:none;display:grid;place-items:center}
.ib{width:auto;min-width:44px;padding:0 6px}
.hr{display:flex;align-items:center;gap:16px;padding:18px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;margin-bottom:14px}
.hr b{display:block;font-size:19px}.hr small{color:var(--sub)}
.hi{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.rr{display:flex;gap:16px;align-items:center;margin:12px 0}.ri{display:flex;flex-direction:column;gap:14px;flex:1}.ri div{display:flex;align-items:center;gap:14px}.ri svg{color:var(--sub);flex:none}
.ptb{background:#F3EBDD;color:#1F2A22;border-radius:6px;flex:1;min-width:40px}
.ptb.on{background:var(--ac)}
.tl{color:var(--ac)}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.p{position:absolute;top:-30px;animation:fall linear infinite}
.p.autumn{border-radius:0 100% 0 100%}
.p.winter{border-radius:50%;opacity:.8}
.p.spring{border-radius:50% 0 50% 0;opacity:.9}
.p.summer{border-radius:50%;opacity:.7;top:auto;bottom:-20px;animation-name:rise}
.p.xmas{border-radius:50%;opacity:.85}
.p.halloween{border-radius:50% 50% 40% 40%;opacity:.8}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.so{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);cursor:pointer}
.so:has(input:checked){border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.so input{flex:none;margin:0;width:18px;height:18px;accent-color:var(--ac)}
.so svg{flex:none}
.so b{display:block;font-size:14px}.so small{display:block;font-size:12px;line-height:1.3;color:var(--sub)}
h1.app{color:var(--tx);font-size:28px;line-height:1.1}
.me{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:700;text-decoration:none;flex:none}
.av.im{background:#E3EFD6;overflow:hidden}.av.im img{width:112%;height:auto;margin-top:6%;display:block}
.mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.mt{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;min-height:132px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--tile,var(--card));color:var(--tx);text-decoration:none}
.mt b{display:block;font:600 19px/1.15 'Fraunces',Georgia,serif}.mt small{font-size:12px;color:var(--sub)}
.mt svg{position:absolute;right:10px;bottom:10px;color:var(--ac);opacity:.6}
.scene{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));height:10vh;z-index:0;pointer-events:none}
.scene svg{display:block;width:100%;height:100%}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@keyframes rise{to{transform:translate3d(var(--dx),-110vh,0)}}
</style>
</head>
<body>
<div class="deco" id="deco" aria-hidden="true"></div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s), g=id=>document.getElementById(id);
const FBH={st:'loading',err:'',warn:'',why:'',stage:'Firebase wird geladen',logs:[],log(t){FBH.logs.push(t);if(FBH.logs.length>14)FBH.logs.shift()},email:'',cols:null,push(){},login:null,logout:null,
 getShared(){const o={};Object.keys(S).forEach(k=>{if(!['user','season','anim'].includes(k))o[k]=S[k]});return JSON.parse(JSON.stringify(o))},
 setShared(d){Object.keys(S).forEach(k=>{if(!['user','season','anim'].includes(k)&&!(k in d))delete S[k]});Object.assign(S,d);S.tickets=S.tickets||{fabi:'',gigi:''}},
 persistS(){try{localStorage.setItem('jw',JSON.stringify(S))}catch(e){}},
 clearCols(){try{localStorage.removeItem('jw-r');localStorage.removeItem('jw-g')}catch(e){}}};
let S={user:null,season:'auto',anim:!matchMedia('(prefers-reduced-motion: reduce)').matches,tickets:{fabi:'',gigi:''}};
try{Object.assign(S,JSON.parse(localStorage.getItem('jw')||'{}'))}catch(e){}
const save=()=>{FBH.persistS();FBH.push()};
const P={fabi:{n:'Fabi',r:'T-Rex',c:'#7FA36B'},gigi:{n:'Gigi',r:'Eichhörnchen',c:'#D98C5F'}};
const SEA={spring:{n:'Frühling',r:'1. März – 31. Mai',in:[[301,531]]},summer:{n:'Sommer',r:'1. Juni – 31. August',in:[[601,831]]},autumn:{n:'Herbst',r:'1.–30. September, 1.–14. November',in:[[901,930],[1101,1114]]},halloween:{n:'Halloween',r:'1.–31. Oktober',in:[[1001,1031]]},winter:{n:'Winter',r:'15. November – 23. Dezember, 7. Januar – 28. Februar',in:[[1115,1223],[107,229]]},xmas:{n:'Weihnachten',r:'24. Dezember – 6. Januar',in:[[1224,1231],[101,106]]}};
const SE=Object.fromEntries([['auto','Automatisch'],...Object.entries(SEA).map(([k,v])=>[k,v.n]),['off','Aus']]);
const mdN=d=>(d.getMonth()+1)*100+d.getDate();
const inS=(k,d=new Date())=>!!SEA[k]&&SEA[k].in.some(([a,b])=>mdN(d)>=a&&mdN(d)<=b);
const auto=()=>Object.keys(SEA).find(k=>inS(k))||'off';

const fig=(k,se)=>(FIG[se||cur()]||FIG.off)[k];
const av=(k,s=44)=>`<span class="av im" style="width:${s}px;height:${s}px" aria-hidden="true"><img src="${fig(k).u}" alt=""></span>`;
const M={
 haushalt:['Jurassic Flat','Haushalt','broom',['Aufgaben mit Serien und Intervallen','Status und Punkte pro Person','Tausch-Angebote']],
 rezepte:['Jurassic Food','Rezepte und Einkauf','pot2',['Lieblingsrezepte mit Zutaten','Drei bis fünf Rezepte pro Woche wählen','Vorhandene Zutaten abhaken','Einkaufsliste nach Kategorien']],
 reisen:['Jurassic Travel','Reisen und Freitickets','case',['Reisen anlegen mit Planungs-To-dos','Gebuchte Zugtickets und Hotels','Bahn-Freitickets pro Person und Jahr']],
 spiele:['Jurassic Games','Brettspiele','meeple',['Spielesammlung gemeinsam verwalten']]};
let note='<p class="sub">Entwurf: Die Daten bleiben vorerst nur auf diesem Gerät. Firebase und der echte Login kommen im nächsten Schritt.</p>';

function picker(){return `<div class="wrap"><h1>Jurassic Wood App</h1><p class="sub">Wer bist du?</p><div class="pick">${Object.keys(P).map(k=>`<button data-u="${k}">${av(k,48)}<span><b>${P[k].n}</b><br><small class="sub">${P[k].r}</small></span></button>`).join('')}</div>${note}</div>`}
function sceneV(){const se=cur(),p=SPAL[se]||SPAL.off,f=FIG[se]||FIG.off,th=94,sh=64,tw=Math.round(th*f.fabi.r),sw=Math.round(sh*f.gigi.r);
 return `<div class="scene" aria-hidden="true">${SCENE.replace(/\{(\w\w)\}/g,(m,k)=>p[k]||m).replace('<!--FIG-->',`<image href="${f.fabi.u}" x="${324-tw}" y="${207-th}" width="${tw}" height="${th}"/><image href="${f.gigi.u}" x="338" y="${208-sh}" width="${sw}" height="${sh}"/>`)}</div>`}
function home(){const u=S.user,d=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});return `<div class="wrap"><header class="top"><div><h1 class="app">Jurassic Wood App</h1><div class="sub" style="margin:2px 0 0">${d}</div></div><a class="me" href="#einstellungen" aria-label="Angemeldet als ${P[u].n}, Profil öffnen">${av(u,36)}${P[u].n}</a></header>
<div class="mg">${Object.keys(M).map(k=>`<a class="mt" href="#${k}"><b>${M[k][0]}</b><small>${M[k][1]}</small><svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${BIG[M[k][2]]}</svg></a>`).join('')}</div></div>${sceneV()}`}
function module(k){const m=M[k];return `<div class="wrap"><a class="back" href="#start">← Start</a><h1>${m[0]}</h1><p class="sub">${m[1]}</p><section class="card"><h2>Geplant</h2><ul>${m[3].map(t=>`<li>${t}</li>`).join('')}</ul></section><p class="sub">Dieses Modul bauen wir als Nächstes aus.</p></div>`}
function settings(){const u=S.user;return `<div class="wrap"><a class="back" href="#start">← Start</a><h1>Profil und Einstellungen</h1>

function guess(n){n=String(n||'').toLowerCase().trim();if(!n)return'Sonstiges';const t=n.split(/[^a-zäöüß]+/);for(const[c,ks]of KW)for(const k of ks){if(k[0]==='='?t.includes(k.slice(1)):k[0]==='$'?t.some(x=>x.endsWith(k.slice(1))):n.includes(k))return c}return'Sonstiges'}

function formV(r){const e=!!r;r=r||{id:'',name:'',img:'',ings:[{q:'',u:'Stk',n:'',c:'Sonstiges'}],steps:''};

function zut(){const rs=R.filter(r=>SEL.includes(r.id));ZI=merge(SEL);
 const by=CATS.map(c=>[c,ZI.filter(x=>x.c===c)]).filter(a=>a[1].length);
 if(!rs.length)return `<div class="wrap"><a class="back" href="#rezepte">← Rezepte</a><h1>Zutaten</h1><p class="sub">Wähle zuerst ein oder mehrere Rezepte aus.</p></div>`;
 return `<div class="wrap"><a class="back" href="#rezepte">← Weitere Rezepte wählen</a><h1>Zutaten prüfen</h1><p class="sub">${rs.length} ${rs.length>1?'Gerichte':'Gericht'}: ${esc(rs.map(r=>r.name).join(', '))}</p><p class="sub">Hake ab, was ihr schon zu Hause habt. Der Rest kommt auf die Einkaufsliste.</p>`+by.map(([c,a])=>`<h2 class="cat">${c}</h2>`+a.map(x=>`<label class="chk si"><input type="checkbox" data-h="${ZI.indexOf(x)}"><span class="sn"><b>${x.q?x.q+' ':''}${x.u} ${esc(x.n)}</b><small class="sub">für ${esc(x.f.join(', '))}</small></span></label>`).join('')).join('')+`<button class="btn" id="addz" style="width:100%;margin-top:20px">Zur Einkaufsliste hinzufügen</button></div>`}
function rez(h){const L=SH(),n=L.filter(x=>!x.done).length,tab=h==='einkauf'?'einkauf':'rezepte',
 head=`<div class="wrap"><a class="back" href="#start">← Start</a><h1>Jurassic Food</h1><div class="tabs"><a href="#rezepte"${tab==='rezepte'?' aria-current="page"':''}>Rezepte</a><a href="#einkauf"${tab==='einkauf'?' aria-current="page"':''}>Einkaufsliste${n?' ('+n+')':''}</a></div>`;
 if(h==='neu')return formV();
 if(h==='zutaten')return zut();
 const m=h.match(/^(r|edit)-(.+)$/),r=m&&R.find(x=>x.id===m[2]);
 if(r)return m[1]==='r'?detail(r):formV(r);
 if(h==='einkauf'){const by=CATS.map(c=>[c,L.filter(x=>x.c===c)]).filter(a=>a[1].length);
  return head+(L.length?`<div class="row"><button class="btn ghost" id="clr">Erledigte löschen</button><button class="btn ghost" id="all">Liste leeren</button></div>`+by.map(([c,a])=>`<h2 class="cat">${c}</h2>`+a.map(x=>`<div class="si${x.done?' dn':''}"><input type="checkbox" data-t="${x.id}" aria-label="${esc(x.n)} abhaken"${x.done?' checked':''}><span class="sn">${esc(x.n)}${x.f&&x.f.length?`<small class="sub">für ${esc(x.f.join(', '))}</small>`:''}</span><span class="qty"><button data-m="${x.id}" aria-label="Weniger">−</button><input type="number" min="0" step="any" inputmode="decimal" data-q="${x.id}" aria-label="Menge ${esc(x.n)}" value="${x.q||''}"><button data-p="${x.id}" aria-label="Mehr">+</button><small class="sub">${x.u}</small></span></div>`).join('')).join(''):'<p class="sub">Die Liste ist leer. Öffne ein Rezept und füge die Zutaten hinzu.</p>')+'</div>'}
 return head+`<input type="search" id="q" placeholder="Rezepte suchen" aria-label="Rezepte suchen"><a class="btn" href="#neu" style="margin-top:12px">+ Neues Rezept</a>`+(R.length?`<div class="rg">${R.map(r=>`<div class="rc" data-n="${esc(r.name.toLowerCase())}"><a class="rl" href="#r-${r.id}">${r.img?`<img src="${r.img}" alt="">`:`<div class="ph">${svg('pot',36)}</div>`}<div class="t"><b>${esc(r.name)}</b><small>${r.ings.length} Zutaten</small></div></a><label class="sel"><input type="checkbox" data-s="${r.id}" aria-label="${esc(r.name)} auswählen"${SEL.includes(r.id)?' checked':''}></label></div>`).join('')}</div>`:'<p class="sub">Noch keine Rezepte. Lege dein erstes Rezept an.</p>')+note+`<div class="bar" id="bar"${SEL.length?'':' hidden'}><span id="bn">${SEL.length} ausgewählt</span><a class="btn" href="#zutaten">Zutaten ansehen</a></div></div>`}
function bindR(h){const m=h.match(/^(r|edit)-(.+)$/),r=m&&R.find(x=>x.id===m[2]),ed=!!(r&&m[1]==='edit');
 if(g('q'))g('q').oninput=e=>document.querySelectorAll('.rc').forEach(c=>c.style.display=c.dataset.n.includes(e.target.value.trim().toLowerCase())?'':'none');
 if(g('addl'))g('addl').onclick=()=>{SEL=[r.id];location.hash='zutaten'};

 document.querySelectorAll('[data-s]').forEach(c=>c.onchange=()=>{SEL=c.checked?[...SEL,c.dataset.s]:SEL.filter(x=>x!==c.dataset.s);g('bar').hidden=!SEL.length;g('bn').textContent=SEL.length+' ausgewählt'});
 if(r)two('del','Wirklich löschen?',()=>{R=R.filter(x=>x.id!==r.id);SEL=SEL.filter(x=>x!==r.id);saveR();location.hash='rezepte'});
 const L=SH(),it=a=>L.find(x=>x.id===a);
 document.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{it(c.dataset.t).done=c.checked;save();render()});
 document.querySelectorAll('[data-m],[data-p]').forEach(b=>b.onclick=()=>{const x=it(b.dataset.m||b.dataset.p);x.q=Math.max(0,rnd((+x.q||0)+(b.dataset.m?-1:1)*stp(x.u)));save();render()});
 document.querySelectorAll('[data-q]').forEach(i=>i.onchange=()=>{it(i.dataset.q).q=Math.max(0,+i.value||0);save();render()});
 if(g('clr'))g('clr').onclick=()=>{S.shop=L.filter(x=>!x.done);save();render()};
 two('all','Wirklich alles leeren?',()=>{S.shop=[];save();render()});
 if(!g('fsv'))return;
 let img=ed?r.img:'';
 g('fi').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,d=>{img=d;g('fp').src=d;g('fp').style.display='block'})};
 g('fa').onclick=()=>g('fl').insertAdjacentHTML('beforeend',ingRow({q:'',u:'Stk',n:'',c:'Sonstiges'}));
 g('fl').onclick=e=>{if(e.target.classList.contains('x'))e.target.closest('.ir').remove()};
 g('fl').onchange=e=>{const row=e.target.closest('.ir'),sel=row&&row.querySelector('.ic');if(!sel)return;if(e.target.classList.contains('ic')){sel.dataset.m='1';return}
  if(e.target.classList.contains('in')&&!sel.dataset.m){const n=e.target.value.trim().toLowerCase();let c=known()[n];if(!c||c==='Sonstiges')c=guess(n);if(c!=='Sonstiges')sel.value=c}};
 g('fsv').onclick=()=>{const name=g('fn').value.trim(),ms=t=>g('msg').textContent=t;

  const rec={id:ed?r.id:uid(),name,img,ings,steps:g('fs').value},old=R;
  R=ed?R.map(x=>x.id===rec.id?rec:x):[rec,...R];
  if(!saveR()){R=old;return ms('Der Speicher ist voll. Wähle ein kleineres Bild oder lösche ein altes Rezept.')}
  location.hash='r-'+rec.id};
}

/* ---- Haushalt ---- */
const $$=s=>[...document.querySelectorAll(s)],DN=['So','Mo','Di','Mi','Do','Fr','Sa'],DAYS={fabi:[1,2],gigi:[4,5],we:[6,0]};
const IV={w4:'4× pro Woche',w2:'2× pro Woche',w1:'1× pro Woche',w2w:'Alle zwei Wochen',m1:'1× pro Monat'},OW={both:'Beide',fabi:'Nur Fabi',gigi:'Nur Gigi',alt:'Abwechselnd'};
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
let HW=0,HM=0,HOC={};
const isH=h=>h==='haushalt'||/^h-/.test(h);
const T=()=>S.tasks=S.tasks||[],LG=()=>S.log=S.log||[],OV=()=>S.ov=S.ov||{},SW=()=>S.swaps=S.swaps||[];
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const monOf=d=>addD(d,-((d.getDay()+6)%7));
const isoW=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const fmt=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
const sole=t=>t.owner==='fabi'||t.owner==='gigi'?t.owner:null;
function occs(ws){const wk=dstr(ws),nr=isoW(ws),o=[];
 T().forEach(t=>{const so=sole(t),add=(p,slot)=>{const key=[t.id,wk,p,slot].join('|');o.push({key,t,slot,p:OV()[key]||p})};
  if(t.interval==='w4'){(so?[so]:['fabi','gigi']).forEach(p=>{add(p,'A');add(p,'B')})}
  else if(t.interval==='w2'){if(so){add(so,'A');add(so,'B')}else['fabi','gigi'].forEach(p=>add(p,'A'))}
  else if(t.interval==='w1')add(so||(nr%2?'gigi':'fabi'),'W');
  else if(t.interval==='w2w'&&nr%2===0)add(so||(nr%4===0?'fabi':'gigi'),'W')});
 return o}
function moccs(y,m){const k=y+'-'+String(m+1).padStart(2,'0');return T().filter(t=>t.interval==='m1').map(t=>{const p=sole(t)||((y*12+m)%2?'gigi':'fabi'),key=[t.id,k,p,'M'].join('|');return{key,t,slot:'M',p:OV()[key]||p}})}
const inWin=(o,d)=>o.slot==='A'?DAYS[o.p].includes(d):o.slot==='B'?DAYS.we.includes(d):true;
const slotL=o=>o.slot==='A'?DAYS[o.p].map(d=>DN[d]).join('/'):o.slot==='B'?'Sa/So':o.slot==='W'?'diese Woche':'dieser Monat';
const stOf=k=>{const l=LG().find(x=>x.k===k);return l?l.s:''};
const ptsOf=(t,s)=>s==='done'?+t.points:s==='absent'?(+t.points)/2:0;
function setSt(k,s){const o=HOC[k];if(!o)return;const L=LG(),i=L.findIndex(x=>x.k===k);if(i>=0&&L[i].s===s)L.splice(i,1);else{if(i>=0)L.splice(i,1);L.push({k,s,p:o.p,pts:ptsOf(o.t,s),at:Date.now(),title:o.t.title})}save();render()}
function conf(sel,lbl,fn){$$(sel).forEach(b=>{const o=b.textContent;let a=0;b.onclick=()=>{if(a)return fn(b);a=1;b.textContent=lbl;setTimeout(()=>{a=0;b.textContent=o},4000)}})}

function authMsg(c){return({'auth/invalid-credential':'E-Mail oder Passwort stimmt nicht.','auth/wrong-password':'E-Mail oder Passwort stimmt nicht.','auth/user-not-found':'E-Mail oder Passwort stimmt nicht.','auth/invalid-email':'Die E-Mail-Adresse ist ungültig.','auth/too-many-requests':'Zu viele Versuche. Bitte warte kurz und versuche es erneut.','auth/network-request-failed':'Keine Verbindung. Prüfe dein Internet.','auth/operation-not-allowed':'E-Mail/Passwort ist in Firebase noch nicht aktiviert.','auth/unauthorized-domain':'Diese Adresse ist in Firebase noch nicht als autorisierte Domain eingetragen.'})[c]||'Anmeldung fehlgeschlagen'+(c?' ('+c+')':'')+'.'}
function gateV(){
 if(FBH.st==='login')return `<div class="wrap"><h1>Jurassic Wood App</h1><p class="sub">Melde dich an, um eure gemeinsamen Daten zu sehen.</p><section class="card"><label for="le">E-Mail</label><input id="le" type="email" autocomplete="username" inputmode="email"><label for="lp">Passwort</label><input id="lp" type="password" autocomplete="current-password"><p class="sub" id="lm" role="alert">${esc(FBH.err)}</p><button class="btn" id="lb" style="width:100%;margin-top:8px">Anmelden</button></section></div>`;
 return `<div class="wrap"><h1>Jurassic Wood App</h1><p class="sub" role="status">${FBH.err?esc(FBH.err):'Verbinde …'}</p>${FBH.err?'':`<p class="sub">${esc(FBH.stage)}</p>`}${FBH.err?'<div class="row"><button class="btn" id="lr">Erneut versuchen</button><button class="btn ghost" id="lq">Abmelden</button></div>'+(FBH.logs.length?'<p class="sub" style="font-size:12px;margin-top:16px">Zuletzt gemeldet:<br>'+FBH.logs.map(esc).join('<br>')+'</p>':''):''}</div>`}
function bindGate(){
 const b=g('lb');
 if(b){const go=async()=>{const e=g('le').value.trim(),p=g('lp').value;if(!e||!p){g('lm').textContent='Bitte E-Mail und Passwort eingeben.';return}b.disabled=true;g('lm').textContent='';try{await FBH.login(e,p)}catch(x){FBH.err=authMsg(x&&x.code);b.disabled=false;g('lm').textContent=FBH.err}};b.onclick=go;g('lp').onkeydown=ev=>{if(ev.key==='Enter')go()}}
 if(g('lr'))g('lr').onclick=()=>location.reload();
 if(g('lq'))g('lq').onclick=()=>FBH.logout()}
FBH.cols={recipes:[()=>R,a=>{R=a}],games:[()=>GD.games,a=>{GD.games=a}],wish:[()=>GD.wish,a=>{GD.wish=a}],amb:[()=>GD.amb,a=>{GD.amb=a}]};
FBH.soft=()=>{const a=document.activeElement,h=location.hash.slice(1),typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|radio|button|submit)$/.test(a.type||'');if(typing||/neu|edit|zutaten/.test(h))return;render()};

function deco(){const d=$('#deco');d.innerHTML='';if(!S.anim)return;const se=cur(),
 cols={autumn:['#E0A458','#D98C5F','#C96F3B'],winter:['#FFFFFF','#B9CDE3'],xmas:['#FFFFFF','#B9CDE3','#F4C46A'],halloween:['#F08A24','#8E5BB5','#F4ECDD'],spring:['#F4B6C8','#CFE6A8'],summer:['#F2B53B','#FFE08A']}[se];if(!cols)return;
 for(let i=0;i<16;i++){const e=document.createElement('span'),s=6+Math.random()*10;e.className='p '+se;
  e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${cols[i%cols.length]};animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*12}s;--dx:${(Math.random()*80-40)|0}px;--rot:${(Math.random()*360)|0}deg`;d.appendChild(e)}}
function theme(){document.documentElement.dataset.season=cur();deco()}
function hint(){const e=g('seh');if(e)e.innerHTML='Aktuell wirksam: <b>'+SE[cur()]+'</b>'}
function render(){const h=location.hash.slice(1)||'start';document.documentElement.dataset.season=cur();if(!$('#deco').firstChild)deco();
 if(FBH.st!=='in'&&FBH.st!=='offline'){$('#app').innerHTML=gateV();bindGate();return}
 note=FBH.st==='offline'?'<p class="sub">Offline-Modus: '+esc(FBH.why||'Firebase ist nicht erreichbar.')+' Die Daten bleiben nur auf diesem Gerät.</p>':FBH.warn?'<p class="sub" role="alert">'+esc(FBH.warn)+'</p>':'';
 const v=!S.user?picker():isR(h)?rez(h):isH(h)?hau(h):isV(h)?rei(h):isG(h)?spi(h):M[h]?module(h):h==='einstellungen'?settings():home();
 $('#app').innerHTML=v+(S.user?nav(isR(h)?'rezepte':isH(h)?'haushalt':isV(h)?'reisen':isG(h)?'spiele':h):'');if(S.user&&isR(h))bindR(h);if(S.user&&isH(h))bindH();if(S.user&&isV(h))bindV(h);if(S.user&&isG(h))bindG(h);
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.user=b.dataset.u;save();location.hash='start';render()});
 if(g('sw'))g('sw').onclick=()=>{S.user=null;save();render()};
 if(g('lo'))g('lo').onclick=()=>FBH.logout();
 $$('[name=se]').forEach(r=>r.onchange=()=>{S.season=r.value;save();theme();hint()});
 if(g('an'))g('an').onchange=e=>{S.anim=e.target.checked;save();deco()};
 if(g('ft'))g('ft').oninput=e=>{S.tickets[S.user]=e.target.value;save()};
 hint()}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
render();

<script type="module">
/*SYNC-START*/
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.keys(x).sort().map(q=>[q,x[q]])):x);
const sig=it=>canon(Object.assign({},it,{img:typeof it.img==='string'?it.img.length+':'+it.img.slice(-24):it.img}));
function startSync(FS,db,H,onState){
 const NAMES=Object.keys(H.cols),ready={},last={shared:undefined},unsubs=[];
 let all=false,stopped=false;
 NAMES.forEach(n=>{last[n]={}});
 const code=e=>e&&e.code?' ('+e.code+')':'';
 const lg=t=>{if(H.log)H.log(t)};
 const failL=e=>{if(stopped)return;lg('Fehler: '+(e&&e.code||e));H.err=e&&e.code==='permission-denied'?'Keine Berechtigung auf die Datenbank. Prüfe die Firestore-Regeln und ob dein Konto freigegeben ist.':'Verbindung zu Firebase fehlgeschlagen'+code(e)+'.';onState('error')};
 const failW=e=>{H.warn=e&&e.code==='permission-denied'?'Änderungen konnten nicht gespeichert werden: keine Berechtigung (Firestore-Regeln).':'Änderungen konnten nicht synchronisiert werden'+code(e)+'.';if(all)H.soft()};
 const changed=()=>{if(!all)return;H.persistS();H.soft()};
 function applyShared(d){const c=canon(d);last.shared=c;if(c!==canon(H.getShared())){H.setShared(d);changed()}}
 function applyCol(n,remote){
  const get=H.cols[n][0],set=H.cols[n][1],loc=get(),
   m=new Map(loc.filter(x=>x&&x.id).map(x=>[x.id,sig(x)])),rs=new Map(remote.map(x=>[x.id,sig(x)]));
  last[n]=Object.fromEntries(rs);
  let same=m.size===rs.size;
  if(same)for(const [id,s] of rs){if(m.get(id)!==s){same=false;break}}
  if(!same){remote.sort((a,b)=>a.id<b.id?1:-1);set(remote);changed()}}
 function doPush(){
  if(!all||stopped)return;
  try{
   const sh=H.getShared(),cs=canon(sh);
   if(cs!==last.shared){last.shared=cs;FS.setDoc(FS.doc(db,'shared','main'),sh).catch(failW)}
   for(const n of NAMES){
    const items=H.cols[n][0](),seen=new Set(),L=last[n];
    for(const it of items){if(!it||!it.id)continue;seen.add(it.id);const s=sig(it);if(L[it.id]!==s){L[it.id]=s;FS.setDoc(FS.doc(db,n,it.id),JSON.parse(JSON.stringify(it))).catch(failW)}}
    for(const id of Object.keys(L)){if(!seen.has(id)){delete L[id];FS.deleteDoc(FS.doc(db,n,id)).catch(failW)}}}
  }catch(e){failW(e)}}
 const check=()=>{if(all||stopped)return;if(!ready.shared||!NAMES.every(n=>ready[n]))return;all=true;H.persistS();H.clearCols();onState('in');doPush()};
 unsubs.push(FS.onSnapshot(FS.doc(db,'shared','main'),snap=>{
  if(stopped)return;
  lg('shared: '+(snap.exists()?'vorhanden':'leer')+(snap.metadata.fromCache?' (Cache)':' (Server)'));
  if(!ready.shared){
   if(snap.exists()||!snap.metadata.fromCache){ready.shared=true;if(snap.exists())applyShared(snap.data());check()}
   return}
  if(snap.exists())applyShared(snap.data())},failL));
 NAMES.forEach(n=>unsubs.push(FS.onSnapshot(FS.collection(db,n),snap=>{
  if(stopped)return;
  const remote=[];snap.forEach(d=>{const x=d.data();if(x&&x.id)remote.push(x)});
  lg(n+': '+remote.length+(snap.metadata.fromCache?' (Cache)':' (Server)'));
  if(!ready[n]){
   if(!snap.empty||!snap.metadata.fromCache){
    ready[n]=true;
    if(snap.empty&&H.cols[n][0]().length){last[n]={}}else{applyCol(n,remote)}
    check()}
   return}
  applyCol(n,remote)},failL)));
 H.push=doPush;
 return{push:doPush,stop(){stopped=true;unsubs.forEach(u=>{try{u()}catch(e){}});H.push=()=>{}}}}
/*SYNC-END*/
(async()=>{
 const CFG={apiKey:"AIzaSyCHKFHc-dUoUzUnJ01PkcTkHbA9G4K-nxk",authDomain:"jurassicwoodapp.firebaseapp.com",projectId:"jurassicwoodapp",storageBucket:"jurassicwoodapp.firebasestorage.app",messagingSenderId:"1030398262587",appId:"1:1030398262587:web:f664e7a464962f26e3cb1e"};
 const V='13.4.0',U=m=>'https://www.gstatic.com/firebasejs/'+V+'/firebase-'+m+'.js';
 const giveUp=m=>{if(FBH.st==='loading'){FBH.why=m;FBH.st='offline';render()}};
 const to=setTimeout(()=>giveUp('Firebase konnte nicht rechtzeitig geladen werden.'),8000);
 let A,AU,FS;
 try{[A,AU,FS]=await Promise.all([import(U('app')),import(U('auth')),import(U('firestore'))])}catch(e){clearTimeout(to);giveUp('Firebase konnte nicht geladen werden.');return}
 clearTimeout(to);
 if(FBH.st==='offline')return;
 FBH.stage='Anmeldestatus wird geprüft';render();
 const wd=setTimeout(()=>{if(FBH.st==='loading'){FBH.err='Der Anmeldestatus konnte nicht geprüft werden. Lade die Seite neu oder öffne sie direkt in Safari bzw. Chrome.';FBH.st='sync';render()}},10000);
 let t2=null;
 const app=A.initializeApp(CFG),auth=AU.getAuth(app);
 let db;try{db=FS.initializeFirestore(app,{experimentalForceLongPolling:true})}catch(e){db=FS.getFirestore(app)}
 let sync=null;
 FBH.login=(e,p)=>AU.signInWithEmailAndPassword(auth,e,p);
 FBH.logout=async()=>{if(sync){sync.stop();sync=null}try{await AU.signOut(auth)}catch(e){}try{FBH.clearCols();const s=JSON.parse(localStorage.getItem('jw')||'{}'),k={};['user','season','anim'].forEach(x=>{if(x in s)k[x]=s[x]});localStorage.setItem('jw',JSON.stringify(k))}catch(e){}location.reload()};
 AU.onAuthStateChanged(auth,u=>{
  clearTimeout(wd);clearTimeout(t2);
  if(sync){sync.stop();sync=null}
  if(!u){FBH.email='';FBH.err='';FBH.st='login';render();return}
  FBH.email=u.email||'';FBH.err='';FBH.warn='';FBH.st='sync';FBH.stage='Daten werden geladen';render();
  t2=setTimeout(()=>{if(FBH.st==='sync'&&!FBH.err){FBH.err='Die Daten konnten nicht geladen werden. Prüfe deine Verbindung und lade die Seite neu.';render()}},15000);
  sync=startSync(FS,db,FBH,s=>{clearTimeout(t2);FBH.st=s==='in'?'in':'sync';render()})
 },e=>{FBH.err='Anmeldestatus konnte nicht geprüft werden'+(e&&e.code?' ('+e.code+')':'')+'.';FBH.st='login';render()});
})();
</script>
